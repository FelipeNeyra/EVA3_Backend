{% extends 'website/base.html' %}
{% block title %}Cambiar contraseña · Beauty Go{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-card">
    <h1>Cambiar contraseña</h1>
    <form class="styled-form" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="cta-button" type="submit">Guardar cambios</button>
    </form>
  </div>
</section>
{% endblock %}
